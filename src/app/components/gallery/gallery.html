<section class="gallery">
  <nav class="gallery__filters" aria-label="Filtrar por categoría">
    @for (option of filters; track option.value) {
      <button
        type="button"
        class="gallery__filter"
        [class.gallery__filter--active]="activeFilter() === option.value"
        [attr.aria-pressed]="activeFilter() === option.value"
        (click)="setFilter(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </nav>

  @if (visibleImages().length > 0) {
    <div class="gallery__grid">
      @for (image of visibleImages(); track image.id) {
        <app-image-card [image]="image" (select)="openLightbox($event)" />
      }
    </div>
  } @else {
    <p class="gallery__empty">No hay imágenes en esta categoría.</p>
  }
</section>

@if (isLightboxOpen()) {
  <app-lightbox
    [images]="visibleImages()"
    [index]="lightboxIndex()!"
    (closed)="closeLightbox()"
    (navigate)="onNavigate($event)"
  />
}
